app:
  name: ai-startup-momentum-signals
  environment: dev

scheduler:
  cadence: "0 * * * *" # hourly cron

storage:
  database_url: "postgresql://user:password@localhost:5432/momentum_signals"

apis:
  github:
    base_url: "https://api.github.com"
    token: "${GITHUB_TOKEN}"
  hacker_news:
    base_url: "https://hacker-news.firebaseio.com/v0"
  reddit:
    base_url: "https://oauth.reddit.com"
    client_id: "${REDDIT_CLIENT_ID}"
    client_secret: "${REDDIT_CLIENT_SECRET}"
    user_agent: "momentum-signals/0.1"
  job_boards:
    greenhouse_base_url: "https://boards-api.greenhouse.io/v1/boards"
    lever_base_url: "https://api.lever.co/v0/postings"

scoring:
  weights:
    product_velocity: 0.35
    market_attention: 0.25
    hiring_momentum: 0.25
    community_engagement: 0.15
  min_signal_threshold: 0.6
